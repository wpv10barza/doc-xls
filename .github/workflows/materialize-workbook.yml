name: Materialize workbook

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-workbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode workbook
        run: |
          mkdir -p .upload
          base64 --decode .upload/analisis_diseno_tesis.b64 > analisis_diseno_tesis.xlsx
          unzip -t analisis_diseno_tesis.xlsx >/dev/null

      - name: Commit binary workbook
        run: |
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: materialize analisis_diseno_tesis.xlsx [skip ci]"
          git push
